<style>
  .passo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin:0 0 44px}
  .passo figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .passo figure img{width:100%;display:block}
  .passo:nth-of-type(even) figure{order:2}
  @media(max-width:820px){.passo{grid-template-columns:minmax(0,1fr)}.passo:nth-of-type(even) figure{order:0}}
  .q{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:820px){.q{grid-template-columns:1fr}}
  .q .card b{display:block;font:800 2.2rem Sora;color:var(--amb);line-height:1;margin-bottom:.3em}
  .vid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.vid{grid-template-columns:1fr}}
  .vid video{width:100%;border-radius:14px;border:1px solid var(--line);background:#000;display:block}
  .vid .reel video{max-width:360px;margin:0 auto}
  .vid p{color:var(--mut);font-size:.9rem;margin:.5em 0 0}
  @media(max-width:900px){nav .links a.sec{display:none}}
  .vid>div,.q>div{min-width:0}
</style>
